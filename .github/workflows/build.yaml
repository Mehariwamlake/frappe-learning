name: Build Image

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      image:
        description: Image name
        type: string
      version:
        description: Image version tag
        type: string
      frappe-repo:
        description: Frappe repo
        type: string
      frappe-version:
        description: Frappe branch
        type: string
      py-version:
        description: Python version
        type: string
      nodejs-version:
        description: NodeJS version
        type: string
      apps-json-base64:
        description: base64 encoded apps.json
        type: string
      dockerfile:
        description: Dockerfile path
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [backend, frontend, websocket]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load build env
        run: |
          cat ./ci/build.env >> $GITHUB_ENV
          echo "VERSION=$(cat ./ci/version.txt)" >> $GITHUB_ENV
          echo "APPS_JSON_BASE64=$(base64 -w 0 ./ci/apps.json)" >> $GITHUB_ENV

      - name: Normalize owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build & Push ${{ matrix.target }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile || env.DOCKERFILE }}
          push: true

          target: ${{ matrix.target }}

          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}-${{ matrix.target }}:${{ inputs.version || env.VERSION }}
            ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}-${{ matrix.target }}:latest

          build-args: |
            FRAPPE_REPO=${{ inputs.frappe-repo || env.FRAPPE_REPO }}
            FRAPPE_BRANCH=${{ inputs.frappe-version || env.FRAPPE_VERSION }}
            PYTHON_VERSION=${{ inputs.py-version || env.PY_VERSION }}
            NODE_VERSION=${{ inputs.nodejs-version || env.NODEJS_VERSION }}
            APPS_JSON_BASE64=${{ inputs.apps-json-base64 || env.APPS_JSON_BASE64 }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

          # 🔥 prevents memory spikes during docker build
          build-args: |
            NODE_OPTIONS=--max-old-space-size=2048